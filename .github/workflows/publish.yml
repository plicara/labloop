# Publishes to PyPI via trusted publishing (OIDC). No API token is stored.
#
# One-time setup, in this order:
#   1. GitHub -> Settings -> Environments -> create an environment named `pypi`.
#   2. PyPI -> Your projects -> Publishing -> Add a pending publisher:
#        Project name:  labloop
#        Owner / Repo:  plicara / labloop
#        Workflow:      publish.yml
#        Environment:   pypi
#
# A pending publisher does NOT reserve the project name — it only lets the
# first release run without a token. The name is claimed on first publish.

name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A GitHub Release can be created in the browser without running
      # scripts/publish.sh, so the workflow repeats its most permanent
      # preflight: refuse a version PyPI already holds, before anything
      # is built or uploaded.
      - name: Refuse a version that already exists on PyPI
        run: |
          VERSION=$(python3 - src/labloop/__init__.py <<'PY'
          import pathlib, re, sys
          match = re.search(r'^__version__ = "([^"]+)"', pathlib.Path(sys.argv[1]).read_text(), re.M)
          if not match:
              sys.exit(f"no __version__ found in {sys.argv[1]}")
          print(match.group(1))
          PY
          )
          bash scripts/check_pypi_version.sh labloop "$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test before shipping
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Require working isolation before shipping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          ruff check .
          mypy
          pytest -q --require-sandbox tests/test_sandbox.py

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
