# Publishes to PyPI via trusted publishing (OIDC). No API token is stored.
#
# One-time setup, in this order:
#   1. GitHub -> Settings -> Environments -> create an environment named `pypi`.
#   2. PyPI -> Your projects -> Publishing -> Add a pending publisher:
#        Project name:  labloop
#        Owner / Repo:  foothills-labs / labloop
#        Workflow:      publish.yml
#        Environment:   pypi
#
# A pending publisher does NOT reserve the project name — it only lets the
# first release run without a token. The name is claimed on first publish.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test before shipping
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
