name: CI

on:
  push:
  pull_request:

# A branch and its pull request share a group, so opening a PR does not run
# the same commit twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Installs the wheel into a clean environment and drives it end to end.
      # `twine check` validates metadata, not that the package actually
      # contains its modules — a packaging mistake passes it and fails on the
      # user's first command.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd "$(mktemp -d)"
          git init -q . && git config user.email ci@test && git config user.name ci
          echo 'print("val_loss = 2.0")' > train.py
          echo 'frozen' > eval.py
          printf 'labloop.jsonl\n__pycache__/\n' > .gitignore
          git add -A && git commit -qm init
          export PYTHONDONTWRITEBYTECODE=1
          L=/tmp/smoke/bin/labloop
          $L --version
          $L noise --run "python train.py" --metric val_loss --repeat 2
          $L baseline --run "python train.py" --metric val_loss --protect eval.py
          $L run --run "python train.py" --metric val_loss --protect eval.py \
              --propose 'echo "print(\"val_loss = 1.0\")" > train.py' --trials 1
          $L run --run "python train.py" --metric val_loss --protect eval.py \
              --propose 'echo cheat > eval.py' --trials 1
          $L log --metric val_loss
          test "$(git log --oneline | wc -l)" = "2" || { echo "expected exactly one kept commit"; exit 1; }
          grep -q harness_changed labloop.jsonl || { echo "harness check did not fire"; exit 1; }
          echo "smoke test passed"
